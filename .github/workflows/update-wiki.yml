name: Publish Docs Articles To Wiki

on:
  schedule:
    - cron: "30 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Clone Wiki
        run: |
          git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/intellsoft/AI-Product-FAQ.wiki.git wiki

      - name: Fetch Post Sitemap
        run: |
          curl -L https://intellsoft.ir/post-sitemap.xml -o post-sitemap.xml

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install beautifulsoup4 lxml

      - name: Extract article URLs
        run: |
          python -c "
from bs4 import BeautifulSoup

BASE_PATH = 'woocommerce-smart-product-qa-wordpress-plugin-guide'

soup = BeautifulSoup(open('post-sitemap.xml', encoding='utf-8'), 'xml')
urls = [loc.text.strip() for loc in soup.find_all('loc') if BASE_PATH in loc.text]

with open('urls.txt','w',encoding='utf-8') as f:
    f.write('\n'.join(urls))

print('Found', len(urls), 'articles')
"

      - name: Publish new articles to Wiki
        run: |
          set -e
          cd wiki

          while IFS= read -r url; do
            [ -z "$url" ] && continue

            slug=$(echo "$url" | sed 's|https://intellsoft.ir/||; s|/$||; s|/|-|g')
            file="$slug.md"

            if [ -f "$file" ]; then
              echo "Already exists: $file"
              continue
            fi

            echo "Processing $url"
            curl -L -s "$url" -o article.html

            python -c "
from bs4 import BeautifulSoup
import sys

url = sys.argv[1]
soup = BeautifulSoup(open('article.html',encoding='utf-8',errors='ignore'), 'html.parser')
article = soup.find('article')

if not article:
    raise SystemExit(1)

title = article.find('h1').get_text(strip=True) if article.find('h1') else 'Documentation'

for tag in article.select('script,style,nav,footer,.toc'):
    tag.decompose()

content = article.get_text(separator='\n\n', strip=True)

with open('body.md','w',encoding='utf-8') as f:
    f.write(f'# {title}\n\n{content}\n\n---\n\n')
    f.write('🔗 **منبع اصلی مقاله:**\n\n')
    f.write(f'👉 [{url}]({url}?utm_source=github_wiki&utm_medium=wiki&utm_campaign=product_faq)\n')
" "$url"

            mv body.md "$file"
            echo "Published $file"

          done < ../urls.txt

      - name: Commit and push
        run: |
          cd wiki
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "auto publish docs"
          git push
